services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_lab
      POSTGRES_USER: crypto_lab
      POSTGRES_PASSWORD: crypto_lab
    ports:
      - "${CSL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_lab -d crypto_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - crypto_lab_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CSL_ENVIRONMENT: development
      CSL_DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@postgres:5432/crypto_lab
      CSL_BINANCE_BASE_URL: https://api.binance.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      CSL_DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@postgres:5432/crypto_lab
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${CSL_FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  crypto_lab_postgres:
