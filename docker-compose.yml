services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_lab
      POSTGRES_USER: crypto_lab
      POSTGRES_PASSWORD: crypto_lab
    ports:
      - "${CSL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_lab -d crypto_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - crypto_lab_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CSL_ENVIRONMENT: development
      CSL_DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@postgres:5432/crypto_lab
      CSL_BINANCE_BASE_URL: https://api.binance.com
      # Keep the Leaderboard populated on its own: dataset, backtest, evaluate,
      # rank (REQUIREMENT.md sections 21-23).
      CSL_AUTO_EVALUATION_ENABLED: "${CSL_AUTO_EVALUATION_ENABLED:-true}"
      CSL_AUTO_EVALUATION_PAIR: "${CSL_AUTO_EVALUATION_PAIR:-BTCUSDT}"
      CSL_AUTO_EVALUATION_TIMEFRAME: "${CSL_AUTO_EVALUATION_TIMEFRAME:-15m}"
      CSL_AUTO_EVALUATION_CANDLES: "${CSL_AUTO_EVALUATION_CANDLES:-500}"
      CSL_AUTO_EVALUATION_INTERVAL_SECONDS: "${CSL_AUTO_EVALUATION_INTERVAL_SECONDS:-3600}"
      CSL_SEARCH_LOOP_ENABLED: "${CSL_SEARCH_LOOP_ENABLED:-true}"
      CSL_SEARCH_LOOP_PAIR: "${CSL_SEARCH_LOOP_PAIR:-BTCUSDT}"
      CSL_SEARCH_LOOP_TIMEFRAME: "${CSL_SEARCH_LOOP_TIMEFRAME:-15m}"
      CSL_SEARCH_LOOP_CANDLES: "${CSL_SEARCH_LOOP_CANDLES:-500}"
      CSL_SEARCH_LOOP_CANDIDATES_PER_CYCLE: "${CSL_SEARCH_LOOP_CANDIDATES_PER_CYCLE:-10}"
      CSL_SEARCH_LOOP_MINIMUM_SIZE: "${CSL_SEARCH_LOOP_MINIMUM_SIZE:-2}"
      CSL_SEARCH_LOOP_MAXIMUM_SIZE: "${CSL_SEARCH_LOOP_MAXIMUM_SIZE:-4}"
      CSL_SEARCH_LOOP_BASE_SEED: "${CSL_SEARCH_LOOP_BASE_SEED:-424242}"
      CSL_SEARCH_LOOP_INTERVAL_SECONDS: "${CSL_SEARCH_LOOP_INTERVAL_SECONDS:-1800}"
      CSL_SENTIMENT_ANALYSIS_ENABLED: "${CSL_SENTIMENT_ANALYSIS_ENABLED:-true}"
      CSL_SENTIMENT_ANALYSIS_INTERVAL_SECONDS: "${CSL_SENTIMENT_ANALYSIS_INTERVAL_SECONDS:-60}"
      CSL_SENTIMENT_ANALYSIS_BATCH_SIZE: "${CSL_SENTIMENT_ANALYSIS_BATCH_SIZE:-50}"
      # News collection is off by default so the deterministic E2E and local runs
      # never reach a public feed on startup; a deployment may enable it.
      CSL_NEWS_COLLECTION_ENABLED: "${CSL_NEWS_COLLECTION_ENABLED:-false}"
      CSL_NEWS_COLLECTION_INTERVAL_SECONDS: "${CSL_NEWS_COLLECTION_INTERVAL_SECONDS:-900}"
      CSL_NEWS_FEEDS: "${CSL_NEWS_FEEDS:-[{\"source\":\"Cointelegraph\",\"url\":\"https://cointelegraph.com/rss\"}]}"
    ports:
      - "${CSL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      CSL_DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@postgres:5432/crypto_lab
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${CSL_FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  crypto_lab_postgres:
