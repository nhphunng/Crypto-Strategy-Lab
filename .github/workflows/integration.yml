name: Integration regression (frontend + backend)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "scripts/integration/**"
      - "docker-compose.yml"
      - "playwright.compose.config.ts"
      - "package.json"
      - ".github/workflows/integration.yml"
      - ".github/workflows/production-cd.yml"
      - ".github/scripts/**"
      - "Dockerfile"
      - "docker-compose.prod.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "scripts/integration/**"
      - "docker-compose.yml"
      - "playwright.compose.config.ts"
      - "package.json"
      - ".github/workflows/integration.yml"
      - ".github/workflows/production-cd.yml"
      - ".github/scripts/**"
      - "Dockerfile"
      - "docker-compose.prod.yml"

concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: node scripts/integration/run-compose-e2e.mjs
        env:
          KEEP_STACK: "1"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-compose-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down the Compose stack
        if: always()
        run: docker compose down -v

  production-cd:
    needs: compose-e2e
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/production-cd.yml
    with:
      head_sha: ${{ github.sha }}
