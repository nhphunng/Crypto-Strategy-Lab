name: Backend quality gates

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crypto_lab
          POSTGRES_USER: crypto_lab
          POSTGRES_PASSWORD: crypto_lab
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U crypto_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@localhost:55432/crypto_lab
      - run: pytest -m 'not performance'
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://crypto_lab:crypto_lab@localhost:55432/crypto_lab
