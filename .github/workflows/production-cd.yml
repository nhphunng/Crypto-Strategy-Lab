name: Production CD

on:
  workflow_call:
    inputs:
      head_sha:
        description: Commit SHA that passed integration CI and must be deployed
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.head_sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/nhphunng/crypto-strategy-lab-api:latest
            ghcr.io/nhphunng/crypto-strategy-lab-api:${{ inputs.head_sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/nhphunng/crypto-strategy-lab-frontend:latest
            ghcr.io/nhphunng/crypto-strategy-lab-frontend:${{ inputs.head_sha }}

  deploy:
    needs: build-and-push

    runs-on:
      - self-hosted
      - Linux
      - production

    steps:
      - name: Deploy production
        run: |
          cd /home/trahoang/app/Crypto-Strategy-Lab

          git fetch --no-tags origin main
          git cat-file -e "${{ inputs.head_sha }}^{commit}"
          git reset --hard "${{ inputs.head_sha }}"

          # Materialize the two runtime-only files before Compose can recreate
          # the API. Existing files win; legacy .env.production values are
          # migrated without being printed or exported to the service.
          python3 .github/scripts/prepare-production-secrets.py \
            --env-file .env.production

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            pull

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --wait --wait-timeout 60

      - name: Verify API
        run: |
          for i in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health/ready; then
              echo
              echo "API is ready."
              exit 0
            fi

            echo "Waiting for API... ($i/20)"
            sleep 3
          done

          echo "API health check failed."

          cd /home/trahoang/app/Crypto-Strategy-Lab

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            ps

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            logs --tail=100 api

          exit 1

      - name: Verify strategy generation
        run: |
          if curl --fail --silent \
            http://127.0.0.1:8000/health/ready/strategy-generation; then
            echo
            echo "Strategy generation is ready."
            exit 0
          fi

          echo "Strategy generation readiness check failed."

          cd /home/trahoang/app/Crypto-Strategy-Lab

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            ps

          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            logs --tail=100 api sandbox-docker artifact-init

          exit 1

      - name: Verify production domain
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            https://csl.nhphung.id.vn
