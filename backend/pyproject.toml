[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crypto-strategy-lab"
version = "0.1.0"
description = "Crypto Strategy Lab modular-monolith backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "pyyaml==6.0.2",
  "ruff==0.11.13",
  "testcontainers[postgres]==4.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_lab"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "performance: opt-in performance gate",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["crypto_lab"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
